[build-system]
requires = ["scikit-build-core>=1.0,<1.1", "nanobind>=3.1.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "sharedbox"
dynamic = ["version"]
description = "Python containers using shared memory."
authors = [
    {name = "Jacopo Abramo", email = "jacopo.abramo@gmail.com"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "psygnal>=0.16.1",
]

[project.scripts]
benchbox = "sharedbox.benchmarks.cli:main"

[project.optional-dependencies]
benchmarks = [
    "pyperf>=2.10.0",
    "typer>=0.27.2",
]

[tool.scikit-build]
sdist.include = ["src/sharedbox/_version.py"]
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"

[tool.scikit-build.cmake]
version = ">=3.30"
build-type = "Release"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "src/sharedbox/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stress: long runs that measure timing, throughput and memory; run with -m stress"]
addopts = ["-m", "not stress"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp314t-*"]
skip = ["*-win32"]
build-verbosity = 1

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E402", "PLC0415"]
ignore = ["BLE001"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyperf"]
ignore_missing_imports = true

[tool.tox]
requires = ["tox>=4.64.1", "tox-uv-bare>=1.36"]
env_list = ["py311", "py312", "py313", "py314", "py314t", "mypy", "lint"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pytest", "-q", { replace = "posargs", extend = true }]]

[tool.tox.env.py314t]
base_python = ["3.14t"]

[tool.tox.env.lint]
runner = "uv-venv-lock-runner"
skip_install = true
dependency_groups = ["lint"]
commands = [["prek", "run", "--all-files", "--show-diff-on-failure"]]

[tool.tox.env.mypy]
dependency_groups = ["dev", "benchmarks"]
# The allowlist covers what stubtest cannot see in nanobind's compiled types
# (its own metaclass, its own static-method wrapper); see stubtest-allowlist.txt.
commands = [
    ["mypy"],
    [
        "python", "-m", "mypy.stubtest", "sharedbox._native",
        "--allowlist", "stubtest-allowlist.txt",
    ],
]

[dependency-groups]
benchmarks = [
    "pyperf>=2.10.0",
    "typer>=0.27.2",
]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "nanobind>=3.1.0",
    "pytest>=9.1.1",
    "pytest-codspeed>=5.0.3",
    "pytest-xdist>=3.8.0",
    "tox>=4.64.1",
    "tox-uv-bare>=1.36",
]
lint = [
    "clang-format>=23.1.1",
    "prek>=0.5.3",
    "ruff>=0.16.8",
]

# uv rebuilds an installed project only
# when these change;
# list the C++ sources
# so an edit to them rebuilds the extension
# instead of reusing the old one.
[tool.uv]
default-groups = ["dev", "lint", "benchmarks"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cmake/*" },
    { file = "include/**/*" },
    { file = "src/sharedbox/_native/**/*" },
    { git = { commit = true } },
]
