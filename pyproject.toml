[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.1.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "sharedbox"
dynamic = ["version"]
description = "Python containers using shared memory."
authors = [
    {name = "Jacopo Abramo", email = "jacopo.abramo@gmail.com"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "psygnal>=0.16.1",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/sharedbox/_version.py"]
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"

[tool.scikit-build.cmake]
version = ">=3.30"
build-type = "Release"

[tool.setuptools_scm]
version_file = "src/sharedbox/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp314t-*"]
skip = ["*-win32"]
build-verbosity = 1

[tool.cibuildwheel.linux]
before-all = [
    "yum install -y curl zip unzip tar git",
    "git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg",
    "git -C /opt/vcpkg checkout dc1232a6e05dcc49703091e83743e3b4df9b9b7c",
    "/opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics",
]
environment = { VCPKG_ROOT = "/opt/vcpkg" }

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = [
    "apk add --no-cache curl zip unzip tar git build-base cmake ninja pkgconf linux-headers",
    "git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg",
    "git -C /opt/vcpkg checkout dc1232a6e05dcc49703091e83743e3b4df9b9b7c",
    "/opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics",
]
environment = { VCPKG_ROOT = "/opt/vcpkg", VCPKG_FORCE_SYSTEM_BINARIES = "1" }

[tool.cibuildwheel.windows]
before-all = [
    "git clone https://github.com/microsoft/vcpkg.git C:/vcpkg-sharedbox",
    "git -C C:/vcpkg-sharedbox checkout dc1232a6e05dcc49703091e83743e3b4df9b9b7c",
    "C:/vcpkg-sharedbox/bootstrap-vcpkg.bat -disableMetrics",
]
environment = { VCPKG_ROOT = "C:/vcpkg-sharedbox" }

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.tox]
requires = ["tox>=4.64.1", "tox-uv-bare>=1.36"]
env_list = ["py311", "py312", "py313", "py314", "py314t", "mypy"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
# CMakeLists.txt requires VCPKG_ROOT to locate the vcpkg Boost install; tox
# does not forward arbitrary environment variables to the build subprocess.
pass_env = ["VCPKG_ROOT"]
commands = [["pytest", "-q", { replace = "posargs", extend = true }]]

[tool.tox.env.py314t]
base_python = ["3.14t"]

[tool.tox.env.mypy]
# The allowlist covers what stubtest cannot see in nanobind's compiled types
# (its own metaclass, its own static-method wrapper); see stubtest-allowlist.txt.
commands = [
    ["mypy"],
    [
        "python", "-m", "mypy.stubtest", "sharedbox._native",
        "--allowlist", "stubtest-allowlist.txt",
    ],
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nanobind>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "tox>=4.64.1",
    "tox-uv-bare>=1.36",
]

# uv rebuilds an installed project only
# when these change;
# list the C++ sources
# so an edit to them rebuilds the extension
# instead of reusing the old one.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "vcpkg.json" },
    { file = "src/sharedbox/_native/**/*" },
    { git = { commit = true } },
]
