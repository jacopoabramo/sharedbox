[build-system]
requires = ["scikit-build-core>=1.0,<1.1", "nanobind>=3.1.0", "sharedbox>=0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "capsule-consumer"
version = "0.1.0"
description = "A nanobind extension that sends sharedbox stream items from a C++ thread"
requires-python = ">=3.11"
dependencies = ["sharedbox>=0.12"]

[tool.scikit-build]
cmake.version = ">=3.30.3"
wheel.py-api = "cp312"
wheel.packages = ["src/capsule_consumer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
