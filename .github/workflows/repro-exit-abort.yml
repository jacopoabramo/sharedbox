# Temporary: reproduces the SIGABRT at child exit seen in CI run 37358880424.
# Delete this file before the branch is merged.
name: Reproduce the abort at exit

on:
  push:
    branches: [ fix/abort-at-child-exit ]

jobs:
  repro:
    name: ${{ matrix.python }} on ${{ matrix.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.12", "3.14t" ]
        # main: the sources of main with this branch's tests; branch: this branch as pushed.
        code: [ main, branch ]
    env:
      UV_PYTHON: ${{ matrix.python }}
      SKBUILD_CMAKE_BUILD_TYPE: RelWithDebInfo
      PYTHONFAULTHANDLER: "1"
      ITERATIONS: "300"
      TEST: tests/test_follow.py::test_closing_or_unfollowing_from_a_forwarded_callback_during_a_move_does_not_deadlock
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use the sources of main
        if: matrix.code == 'main'
        run: git checkout origin/main -- src include CMakeLists.txt cmake

      - uses: astral-sh/setup-uv@v7

      - name: Install gdb and allow core dumps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdb
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p.%t

      - name: Build from source
        run: uv sync --dev

      - name: Run the test in a loop
        run: |
          ulimit -c unlimited
          mkdir -p logs
          failures=0
          aborts=0
          for i in $(seq 1 "$ITERATIONS"); do
            if ! uv run --no-sync pytest "$TEST" -q -p no:cacheprovider > "logs/run-$i.txt" 2>&1; then
              failures=$((failures + 1))
              if grep -q "SIGABRT" "logs/run-$i.txt"; then
                aborts=$((aborts + 1))
              fi
              echo "::group::iteration $i failed"
              cat "logs/run-$i.txt"
              echo "::endgroup::"
            else
              rm "logs/run-$i.txt"
            fi
          done
          echo "iterations=$ITERATIONS failures=$failures aborts=$aborts" | tee logs/summary.txt
          echo "${{ matrix.python }} on ${{ matrix.code }}: $ITERATIONS iterations, $failures failed, $aborts aborted" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the exit stress test
        if: always()
        run: |
          test -f tests/stress/test_stress_exit.py || exit 0
          ulimit -c unlimited
          uv run --no-sync pytest tests/stress/test_stress_exit.py -m stress -v -p no:cacheprovider 2>&1 | tee logs/stress.txt

      - name: Print a backtrace of every core
        if: always()
        run: |
          python_exe=$(uv run --no-sync python -c "import os, sys; print(os.path.realpath(sys.executable))")
          shopt -s nullglob
          for core in /tmp/cores/core.*; do
            echo "::group::$core"
            gdb -batch -ex "info threads" -ex "thread apply all bt" "$python_exe" "$core" 2>&1 | tee "$core.bt.txt"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.python }}-${{ matrix.code }}
          path: |
            logs/
            /tmp/cores/
          if-no-files-found: ignore
