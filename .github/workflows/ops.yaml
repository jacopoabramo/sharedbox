name: Ops

on:
  pull_request:
    branches: [ main ]
    types: [ labeled, synchronize ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops:
    name: Reads and writes against the base branch on Windows
    # Another label added to a pull request that already carries ops starts no second run.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'ops')
          && (github.event.action != 'labeled' || github.event.label.name == 'ops'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: base
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Install both
        shell: bash
        run: |
          for side in base head; do
            (cd "$side" && uv sync --frozen --python 3.11)
          done

      - name: Run benchbox ops, alternating base and head
        shell: bash
        env:
          # The 64k set and dict rows nearly double the job, so a pull request skips them.
          SIZES: ${{ github.event_name == 'pull_request' && '[!6]*' || '*' }}
        run: |
          mkdir results
          step=0
          total=18 # 3 rounds x 2 sides x (int, record), plus list, set and dict once per side
          for round in 1 2 3; do
            for side in base head; do
              for rows in int record list set dict; do
                case "$rows" in list|set|dict) [ "$round" != 1 ] && continue ;; esac # not gated, one round is enough
                step=$((step + 1))
                echo "::group::[$step/$total] round $round, $side, $rows rows"
                case "$rows" in
                  list) pattern="*list*/*" ;;
                  set) pattern="*set$SIZES/*" ;;
                  dict) pattern="*dict$SIZES/*" ;;
                  *) pattern="*$rows/SharedBox" ;;
                esac
                (cd "$side" && uv run --no-sync benchbox ops --fast \
                  --filter "$pattern" --json "../results/$side-$round-$rows.json")
                echo "::endgroup::"
              done
            done
          done

      - name: Compare base and head
        shell: bash
        run: |
          cd head
          uv run --no-sync python scripts/ops_compare.py ../results | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ops
          path: results
