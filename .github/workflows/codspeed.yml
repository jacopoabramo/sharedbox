name: CodSpeed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install vcpkg and boost-interprocess
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install boost-interprocess

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package and install dependencies
        run: uv sync --dev --frozen --python 3.12

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks --codspeed
