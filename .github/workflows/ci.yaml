name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # local hooks in prek.toml call `uv run --locked --only-group lint ...`
      - uses: astral-sh/setup-uv@v7

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"

  docs:
    name: Check documentation
    uses: ./.github/workflows/check-docs.yaml

  publish_docs:
    name: Publish documentation
    needs: [lint, docs]
    # main and final releases only: a pre-release publishes a package and
    # leaves the site describing the last final release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published' &&
       !github.event.release.prerelease)
    uses: ./.github/workflows/publish-docs.yaml
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false

  cpp_header:
    name: C++ header on ${{ matrix.os }} (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, build: Release, flags: "" }
          - { os: windows-latest, build: Release, flags: "" }
          # No ThreadSanitizer: the sequence lock's reader copies the record while a writer may change it, by design.
          - os: ubuntu-latest
            build: RelWithDebInfo
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -DSHAREDBOX_TEST_ROUNDS=20000
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and run the C++ tests
        shell: bash
        run: |
          cmake -S tests/cpp -B build-cpp -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_C_FLAGS_INIT="${{ matrix.flags }}" -DCMAKE_CXX_FLAGS_INIT="${{ matrix.flags }}"
          cmake --build build-cpp --config ${{ matrix.build }}
          ctest --test-dir build-cpp -C ${{ matrix.build }} --output-on-failure

      - uses: astral-sh/setup-uv@v7

      - name: Build the extension and run the C consumer
        if: matrix.build == 'Release'
        shell: bash
        env:
          SHAREDBOX_REQUIRE_C_CONSUMER: "1"
        run: |
          uv sync --dev
          uv run --no-sync pytest tests/test_capsule.py -q

      - name: Create a box larger than a 16 MiB /dev/shm
        if: runner.os == 'Linux' && matrix.build == 'Release'
        run: |
          docker run --rm --shm-size=16m -v "$PWD":/src -w /src ubuntu:24.04 build-cpp/test_small_shm

  build_wheels:
    name: Build wheel for ${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: cp311, platform_id: win_amd64 }
          - { os: windows-latest, python: cp312, platform_id: win_amd64 }
          - { os: windows-latest, python: cp314t, platform_id: win_amd64 }
          - { os: ubuntu-latest, python: cp311, platform_id: manylinux_x86_64 }
          - { os: ubuntu-latest, python: cp312, platform_id: manylinux_x86_64 }
          - { os: ubuntu-latest, python: cp314t, platform_id: manylinux_x86_64 }
          - { os: ubuntu-latest, python: cp311, platform_id: musllinux_x86_64 }
          - { os: ubuntu-latest, python: cp312, platform_id: musllinux_x86_64 }
          - { os: ubuntu-latest, python: cp314t, platform_id: musllinux_x86_64 }

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_CONTAINER_ENGINE: "docker; create_args: --shm-size=1g"
          CIBW_TEST_REQUIRES: pytest hypothesis
          CIBW_TEST_COMMAND: pytest {project}/tests
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.python }}-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl

      - name: Measure wheel and extension size
        shell: bash
        run: |
          echo "### Wheel size: ${{ matrix.python }}-${{ matrix.platform_id }}" >> "$GITHUB_STEP_SUMMARY"
          # Run by path, not with -m: importing the sharedbox package loads its
          # compiled extension and psygnal, which this runner does not have installed.
          python src/sharedbox/benchmarks/size.py wheelhouse/*.whl --json wheelhouse/sizes.json --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload size artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-sizes-${{ matrix.python }}-${{ matrix.platform_id }}
          path: wheelhouse/sizes.json

  sizes:
    name: Report wheel size changes
    runs-on: ubuntu-latest
    needs: [build_wheels]
    permissions:
      contents: read
      actions: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Download this run's size artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-sizes-*
          path: sizes/this

      - name: Find the latest successful run on main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yaml \
            --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the baseline's size artifacts
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-sizes-*
          path: sizes/main
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Report size differences
        shell: bash
        # Run by path, not with -m: importing the sharedbox package loads its
        # compiled extension and psygnal, which this runner does not have installed.
        run: python src/sharedbox/benchmarks/size_diff.py sizes/this sizes/main >> "$GITHUB_STEP_SUMMARY"

  stress:
    name: Stress tests on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheel: cibw-wheels-cp312-manylinux_x86_64 }
          - { os: windows-latest, wheel: cibw-wheels-cp312-win_amd64 }
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.wheel }}
          path: wheelhouse

      - name: Run the stress tests against the built wheel
        shell: bash
        run: |
          uv venv --python 3.12 .stress
          uv pip install --python .stress wheelhouse/*.whl pytest hypothesis
          python=.stress/bin/python
          [ -x "$python" ] || python=.stress/Scripts/python.exe
          "$python" -m pytest -m stress -q -p no:cacheprovider
          "$python" -m pytest tests/test_properties_codec.py tests/test_properties_layout.py tests/test_properties_forged.py tests/test_properties_stateful.py -q -p no:cacheprovider --hypothesis-profile=thorough

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.os }}
          path: build/stress/*.json

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    needs: [build_wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Check the release tag and pre-release flag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.ZrcN"; exit 1
          fi
          case "$TAG" in
            *rc*) [ "$PRERELEASE" = "true" ] || { echo "::error::$TAG must be marked pre-release"; exit 1; } ;;
            *)    [ "$PRERELEASE" = "false" ] || { echo "::error::$TAG must not be marked pre-release"; exit 1; } ;;
          esac

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check the sdist version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test -f "dist/sharedbox-${TAG#v}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [lint, docs, cpp_header, build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sharedbox
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
