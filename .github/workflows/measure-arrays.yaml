name: Measure array reads (temporary)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  measure:
    name: Array reads on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --frozen --python 3.12

      - name: Time array reads and writes, three runs
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "### Run $i on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            uv run --no-sync benchbox ops --fast --filter "*array*" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
